apiVersion: cystemd.io/v1alpha1
kind: AppProject
metadata:
  name: platform
spec:
  description: Platform services
  sourceRepos:
    - https://git.example.com/platform/*
  destinations:
    - name: in-cluster
      namespace: platform
  # No automated syncs over the weekend; people may still sync by hand.
  syncWindows:
    - kind: deny
      schedule: "0 18 * * 5"
      duration: 62h
      timeZone: Europe/Amsterdam
      applications: ["*"]
      manualSync: true
      description: Weekend freeze
